<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WeatherForecast project icon</title>
  <desc id="desc">A voxel-style sun behind a rain cloud with an integrated clock.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58bbff"/>
      <stop offset="1" stop-color="#238fdf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07558f" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <g filter="url(#shadow)" shape-rendering="geometricPrecision">
    <!-- Symmetrical sun with separated rays and a single clear disc -->
    <g shape-rendering="crispEdges">
      <g fill="#d97800" transform="translate(6 8)">
        <rect x="151" y="38" width="28" height="39"/>
        <rect x="223" y="68" width="28" height="28"/>
        <rect x="244" y="136" width="34" height="28"/>
        <rect x="52" y="136" width="34" height="28"/>
        <rect x="79" y="68" width="28" height="28"/>
      </g>
      <g fill="#ffd332" stroke="#e98b00" stroke-width="5">
        <rect x="151" y="38" width="28" height="39"/>
        <rect x="223" y="68" width="28" height="28"/>
        <rect x="244" y="136" width="34" height="28"/>
        <rect x="52" y="136" width="34" height="28"/>
        <rect x="79" y="68" width="28" height="28"/>
      </g>
      <path fill="#d97800" d="M132 86h66v12h18v18h12v68h-12v18h-18v12h-66v-12h-18v-18h-12v-68h12V98h18z" transform="translate(6 8)"/>
      <path fill="#ffc21c" stroke="#e98b00" stroke-width="7" stroke-linejoin="miter" d="M132 86h66v12h18v18h12v68h-12v18h-18v12h-66v-12h-18v-18h-12v-68h12V98h18z"/>
      <path fill="#ffe66a" d="M132 105h54v10h16v16h10v34h-10v10h-70v-10h-12v-44h12z"/>
    </g>

    <!-- Cloud extrusion -->
    <path fill="#184e7b" d="M68 341v-62h25v-43h43v-31h54v-26h73v19h58v-27h74v21h39v28h36v45h25v76h-18v22H91v-22z" transform="translate(0 15)"/>

    <!-- Main cloud -->
    <path fill="#527ca8" stroke="#274f78" stroke-width="8" stroke-linejoin="miter" d="M68 341v-62h25v-43h43v-31h54v-26h73v19h58v-27h74v21h39v28h36v45h25v76h-18v22H91v-22z"/>

    <!-- Cloud highlights and voxel facets -->
    <path fill="#769bc1" d="M97 279h39v-39h58v-31h69v23h-45v31h-54v31h-39v48H97z"/>
    <path fill="#89acd0" d="M194 209h69v23h58v-27h72v20h-44v21h-51v25h-53v-22h-51z"/>
    <path fill="#3e6b97" d="M72 320h53v21h41v18H91v-18H72zM166 294h54v65h-54zM220 271h56v88h-56zM276 319h92v40h-92zM368 298h99v43h-99z"/>
    <path fill="#315f8c" d="M91 341h386v22H91z"/>

    <!-- Pixel clock ring -->
    <path fill="#1e344c" d="M329 211h58v12h20v20h12v58h-12v20h-20v12h-58v-12h-20v-20h-12v-58h12v-20h20z"/>
    <path fill="#728aa5" d="M333 219h50v12h20v16h9v50h-9v16h-20v12h-50v-12h-20v-16h-9v-50h9v-16h20z"/>
    <path fill="#f5f8fa" d="M335 233h46v10h14v14h10v30h-10v14h-14v10h-46v-10h-14v-14h-10v-30h10v-14h14z"/>
    <path fill="#ffffff" d="M335 243h38v9h13v13h9v18h-9v11h-13v8h-38v-8h-7v-51z"/>

    <!-- Clock hands -->
    <path fill="#172333" d="M351 251h14v36h-14zM358 278l37 22-8 13-36-22z"/>
    <rect x="348" y="274" width="20" height="20" rx="3" fill="#172333"/>
    <rect x="353" y="279" width="10" height="10" fill="#34475e"/>

    <!-- Rain streaks -->
    <g>
      <path fill="#0873b7" d="M141 387h29v27h-11v29h-29v-29h11z" transform="translate(7 8)"/>
      <path fill="#20d7ff" d="M141 379h29v27h-11v29h-29v-29h11z"/>
      <path fill="#8cecff" d="M147 383h12v23h-11v18h-10v-18h9z"/>

      <path fill="#0873b7" d="M244 405h29v27h-11v35h-29v-35h11z" transform="translate(7 8)"/>
      <path fill="#20d7ff" d="M244 397h29v27h-11v35h-29v-35h11z"/>
      <path fill="#8cecff" d="M250 401h12v23h-11v24h-10v-24h9z"/>

      <path fill="#0873b7" d="M347 386h29v27h-11v29h-29v-29h11z" transform="translate(7 8)"/>
      <path fill="#20d7ff" d="M347 378h29v27h-11v29h-29v-29h11z"/>
      <path fill="#8cecff" d="M353 382h12v23h-11v18h-10v-18h9z"/>
    </g>
  </g>
</svg>
